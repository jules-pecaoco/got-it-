<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Got It! · Proctor</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/ui-refinements.css">
  <script type="module" src="/proctor.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="brand-lockup"><div class="brand" id="platform-label">Got It!</div><small class="brand-tagline" id="platform-tagline">Gotta Catch Ed All</small></div>
    <button type="button" id="proctor-logout" class="hidden text-button">Sign out</button>
  </header>
  <div id="request-status" class="request-status hidden" role="status" aria-live="polite" aria-atomic="true" aria-busy="false">
    <span class="request-spinner" aria-hidden="true"></span><span id="request-status-text">Loading proctor settings…</span>
  </div>
  <main>
    <div id="notice" role="status" aria-live="polite"></div>
    <section id="proctor-login-panel" class="page-width">
      <form id="proctor-login" class="card stack compact proctor-login">
        <h1>Proctor sign in</h1>
        <label>Run ID<input id="proctor-run-id" required autocomplete="off"></label>
        <label>Proctor code<input id="proctor-code" type="password" required autocomplete="off"></label>
        <button type="submit" class="primary">View run</button>
      </form>
    </section>
    <section id="proctor-dashboard" class="page-width hidden">
      <div class="proctor-heading">
        <div>
          <h1 id="proctor-run-name"></h1>
          <p id="proctor-run-meta" class="small"></p>
        </div>
        <button type="button" id="proctor-refresh">Refresh</button>
      </div>
      <p id="proctor-update" class="small" role="status"></p>
      <div id="proctor-counts" class="proctor-counts" aria-label="Participation summary"></div>
      <div class="proctor-toolbar">
        <label>Search students<input id="proctor-search" type="search" placeholder="Name or school ID"></label>
        <label>Status<select id="proctor-filter">
          <option value="all">All</option>
          <option value="registered">Not started</option>
          <option value="in_progress">In progress</option>
          <option value="submitted">Submitted</option>
          <option value="expired">Time ended</option>
        </select></label>
      </div>
      <p id="proctor-match-count" class="small"></p>
      <div class="table-wrap proctor-table-wrap" tabindex="0" role="region" aria-label="Student participation. Scroll horizontally for more columns.">
        <table class="proctor-table">
          <thead><tr>
            <th scope="col">Student</th><th scope="col">Section</th><th scope="col">Status</th>
            <th scope="col">Questions</th><th scope="col">Last submission</th><th scope="col">Last seen</th><th scope="col">Time left</th>
          </tr></thead>
          <tbody id="proctor-rows"></tbody>
        </table>
      </div>
      <p class="small proctor-footnote">In progress means an attempt has started; it does not indicate whether the student's browser is open.</p>
    </section>
  </main>
</body>
</html>
